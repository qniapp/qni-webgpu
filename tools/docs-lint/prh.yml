version: 1

# AGENTS.md の用語集と過去のルー語修正パターンを prh ルールとして管理する。
# 新しい用語の方針が決まったらこの prh.yml に追記し、`docs/` 側もこのルールに従って統一する。
#
# rule の書き方:
#   - expected: 望ましい表記
#     patterns: [一致させたい表記の正規表現]
#   - 正規表現は HTML/Markdown 抽出後のテキストに対して評価される。
#     コード識別子・CSS クラス・URL トークンに偶発マッチしないよう、
#     できるだけ「日本語の助詞」「日本語語幹」を伴うパターンに絞る。

rules:
  - expected: 算術ゲート
    pattern: /アリスメティックゲート/

  - expected: インクリメント
    pattern: /インクレメント/

  - expected: デクリメント
    pattern: /デクレメント/

  - expected: ベルペア
    pattern: /Bell ペア/
  - expected: 事後選択
    patterns:
      - /ポストセレクション/
      - /(?<!事)後選択/

  - expected: 生存率
    pattern: /生存確率/

  - expected: 検出器
    patterns:
      - /ディテクター/
      - /ディテクタ(?!ー)/

  - expected: 確率表示ブロック
    patterns:
      - /Probability display/
      - /probability display/
      - /確率表示ゲート/

  - expected: ブロッホ球表示ブロック
    patterns:
      - /Bloch Sphere display/
      - /Bloch sphere display/
      - /Bloch Display/
      - /Bloch display/
      - /bloch display/

  - expected: 振幅表示ブロック
    patterns:
      - /Amplitude Display/
      - /Amplitude display/
      - /amplitude display/

  - expected: サンプル表示ブロック
    patterns:
      - /Sample Display/
      - /Sample display/
      - /sample display/
      - /サンプル表示ゲート/

  - expected: パリティ制御
    patterns:
      - /Parity Control/
      - /Parity control/
      - /parity control/
      - /パリティコントロール/
      - /パリティ制御ゲート/

  - expected: 表示ブロック
    patterns:
      - /display gate/
      - /表示ゲート/

  - expected: 縦レイアウト
    patterns:
      - /縦向きレイアウト/
      - /ポートレートレイアウト/
      - /[Pp]ortrait layout/
      - /[Vv]ertical layout/

  - expected: 横レイアウト
    patterns:
      - /横向きレイアウト/
      - /ランドスケープレイアウト/
      - /[Ll]andscape layout/
      - /[Hh]orizontal layout/

  - expected: パレットのカルーセル
    patterns:
      - /カルーセルパレット/
      - /パレットカルーセル/
      - /[Pp]alette carousel/

  - expected: 測定ゲート
    patterns:
      - /計測ゲート/

  - expected: コメントブロック
    patterns:
      - /回路コメントブロック/
      - /サーキットブロック/
      - /コメント付きブロック/
      - /注釈ブロック/
      - /回路ブロック/
      - /回路コメントブロック/
      - /サーキットブロック/

  - expected: ブロッホ球
