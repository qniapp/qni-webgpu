<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>qni-web</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link data-trunk rel="rust" data-wasm-opt="z" data-target-name="qni_web" />
    <link data-trunk rel="copy-file" href=".trunk-generated/bootstrap.js" />
    <link data-trunk rel="copy-file" href="favicon.ico" />
    <link data-trunk rel="copy-file" href="icon.svg" />
    <link data-trunk rel="copy-file" href="apple-touch-icon.png" />
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #ffffff;
      }

      #egui-canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      #app-status {
        position: fixed;
        inset: 1rem 1rem auto 1rem;
        max-width: 42rem;
        padding: 0.875rem 1rem;
        border-radius: 0.75rem;
        border: 1px solid #ef4444;
        background: rgba(255, 244, 244, 0.96);
        color: #7f1d1d;
        font: 14px/1.5 system-ui, sans-serif;
        box-shadow: 0 12px 40px rgba(127, 29, 29, 0.14);
        white-space: pre-wrap;
      }

      #app-status[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <canvas id="egui-canvas"></canvas>
    <div id="app-status" data-testid="webgpu-error" hidden></div>
    <script type="module" src="bootstrap.js"></script>
  </body>
</html>
