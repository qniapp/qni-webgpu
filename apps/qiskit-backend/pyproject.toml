[project]
name = "qni-qiskit-backend"
version = "0.1.0"
description = "QNI external GPU execution backend for Qiskit Aer"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy==2.2.6",
  "qiskit==1.4.2",
  "qiskit-aer==0.15.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qni_qiskit_backend"]
