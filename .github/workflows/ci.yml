name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '9'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: apps/egui-web/pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: "true"
          cache-all-crates: "true"

      - name: Install trunk
        uses: taiki-e/install-action@v2
        with:
          tool: trunk

      - name: Install Web deps
        run: pnpm install --frozen-lockfile
        working-directory: apps/egui-web

      - name: Install Playwright browser
        run: pnpm exec playwright install chromium
        working-directory: apps/egui-web

      - name: Web preflight
        run: pnpm -C apps/egui-web run test:preflight

      - name: Web Cucumber BDD
        run: pnpm -C apps/egui-web run test:bdd

      - name: Web Playwright legacy
        run: pnpm -C apps/egui-web run test:pw-legacy

  mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '9'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: apps/mcp-qni/pnpm-lock.yaml

      - name: Install MCP deps
        run: pnpm install --frozen-lockfile
        working-directory: apps/mcp-qni

      - name: MCP check
        run: pnpm -C apps/mcp-qni check

  tui:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: "true"
          cache-all-crates: "true"
          cache-directories: ~/.cargo/advisory-db

      - name: Install cargo audit/deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny

      - name: TUI check
        run: make check
