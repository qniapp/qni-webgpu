name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master, feat/embed-restart-button]

jobs:
  web-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: '9'

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install Web deps
        run: pnpm install --frozen-lockfile
        working-directory: apps/web

      - name: Web preflight
        run: pnpm -C apps/web run test:preflight

      - name: Deployment config tests
        run: node --test test-node/*.test.cjs

  web-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: '9'

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: "true"
          cache-all-crates: "true"
          workspaces: |
            apps/web

      - name: Install trunk
        uses: taiki-e/install-action@v2
        with:
          tool: trunk

      - name: Install Web deps
        run: pnpm install --frozen-lockfile
        working-directory: apps/web

      - name: Web Playwright dev trunk build
        run: env -u NO_COLOR TRUNK_COLOR=never trunk build --dist playwright-dist
        working-directory: apps/web

      - name: Web embed build
        env:
          QNI_SOURCE_COMMIT: ${{ github.sha }}
        run: pnpm run build:embed
        working-directory: apps/web

      - name: Validate embed release dry-run
        run: |
          node apps/web/scripts/embed-release.mjs dry-run --input apps/web/embed-dist --output "$RUNNER_TEMP/embed-release" --source-commit "$GITHUB_SHA"
          node apps/web/scripts/embed-release.mjs verify --output "$RUNNER_TEMP/embed-release" --source-commit "$GITHUB_SHA"

      - name: Upload Web Playwright bundle
        uses: actions/upload-artifact@v7
        with:
          name: web-playwright-bundle
          path: |
            apps/web/playwright-dist
            apps/web/embed-dist
          retention-days: 1
          if-no-files-found: error

  web-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: '9'

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: "true"
          cache-all-crates: "true"
          workspaces: |
            apps/web

      - name: Install trunk and cargo-insta
        uses: taiki-e/install-action@v2
        with:
          tool: trunk,cargo-insta

      - name: Install Web deps
        run: pnpm install --frozen-lockfile
        working-directory: apps/web

      - name: Web Rust check
        run: apps/web/scripts/check-rust.sh

      - name: Web production trunk build
        run: env -u NO_COLOR TRUNK_COLOR=never trunk build --release --public-url ./
        working-directory: apps/web

      - name: Web Cucumber BDD (static dist)
        run: |
          python3 -m http.server 4174 --bind 127.0.0.1 --directory dist >/tmp/web-bdd-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          python3 - <<'PY'
          import time
          import urllib.request

          url = 'http://127.0.0.1:4174/'
          deadline = time.time() + 20
          while time.time() < deadline:
              try:
                  with urllib.request.urlopen(url) as response:
                      response.read()
                  break
              except Exception:
                  time.sleep(0.25)
          else:
              raise SystemExit('Timed out waiting for static web server')
          PY
          QNI_WEB_EXTERNAL_SERVER=1 QNI_WEB_BASE_URL=http://127.0.0.1:4174 pnpm run test:bdd
        working-directory: apps/web

      - name: Web Pages variant Rust check
        run: |
          cargo clippy --locked --target wasm32-unknown-unknown --tests --features pages -- -D warnings
          cargo test --locked --lib --features pages
          cargo insta pending-snapshots
        working-directory: apps/web

      - name: Web Pages variant build
        run: env -u NO_COLOR TRUNK_COLOR=never TRUNK_BUILD_FEATURES=pages trunk build --release --dist pages-dist
        working-directory: apps/web

      - name: Web Pages variant Playwright
        run: |
          python3 -m http.server 4175 --bind 127.0.0.1 --directory pages-dist >/tmp/web-pages-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          curl --retry 20 --retry-connrefused --retry-delay 1 --fail http://127.0.0.1:4175/ >/dev/null
          QNI_WEB_EXTERNAL_SERVER=1 QNI_WEB_BASE_URL=http://127.0.0.1:4175 pnpm exec playwright test -c playwright.pages.config.ts
        working-directory: apps/web

  web-kani:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify Kani proofs and broken variants
        uses: model-checking/kani-github-action@v1.1
        with:
          kani-version: '0.68.0'
          command: bash
          args: apps/web/scripts/verify-kani.sh

  web-playwright:
    needs: web-build
    name: web-playwright (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: '9'

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install Web deps
        run: pnpm install --frozen-lockfile
        working-directory: apps/web

      - name: Download Web Playwright bundle
        uses: actions/download-artifact@v8
        with:
          name: web-playwright-bundle
          path: apps/web

      - name: Web Playwright shard
        run: |
          node -r ts-node/register/transpile-only scripts/serve-static.ts playwright-dist 4174 >/tmp/web-playwright-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          python3 - <<'PY'
          import time
          import urllib.request

          url = 'http://127.0.0.1:4174/'
          deadline = time.time() + 20
          while time.time() < deadline:
              try:
                  with urllib.request.urlopen(url) as response:
                      response.read()
                  break
              except Exception:
                  time.sleep(0.25)
          else:
              raise SystemExit('Timed out waiting for Playwright static server')
          PY
          QNI_WEB_EXTERNAL_SERVER=1 QNI_WEB_BASE_URL=http://127.0.0.1:4174 pnpm exec playwright test --shard=${{ matrix.shard }}/4 --reporter=dot,blob
        working-directory: apps/web

      - name: Upload Playwright blob report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-${{ matrix.shard }}
          path: apps/web/blob-report
          retention-days: 7

      - name: Upload Playwright test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results-${{ matrix.shard }}
          path: apps/web/test-results
          retention-days: 7

  web-playwright-report:
    needs: web-playwright
    if: always() && needs.web-playwright.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: '9'

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install Web deps
        run: pnpm install --frozen-lockfile
        working-directory: apps/web

      - name: Download Playwright blob reports
        uses: actions/download-artifact@v8
        with:
          pattern: blob-report-*
          merge-multiple: true
          path: apps/web/all-blob-reports

      - name: Merge Playwright reports
        run: pnpm exec playwright merge-reports --reporter html ./all-blob-reports
        working-directory: apps/web

      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  web:
    needs: [web-preflight, web-build, web-check, web-kani, web-playwright]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check Web job results
        env:
          PREFLIGHT_RESULT: ${{ needs.web-preflight.result }}
          BUILD_RESULT: ${{ needs.web-build.result }}
          CHECK_RESULT: ${{ needs.web-check.result }}
          KANI_RESULT: ${{ needs.web-kani.result }}
          PLAYWRIGHT_RESULT: ${{ needs.web-playwright.result }}
        run: |
          test "$PREFLIGHT_RESULT" = success
          test "$BUILD_RESULT" = success
          test "$CHECK_RESULT" = success
          test "$KANI_RESULT" = success
          test "$PLAYWRIGHT_RESULT" = success

  qiskit-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Backend editable install smoke
        run: |
          python3 -m venv /tmp/qni-backend-venv
          /tmp/qni-backend-venv/bin/python -m pip install --upgrade pip
          /tmp/qni-backend-venv/bin/python -m pip install --no-deps -e apps/qiskit-backend

      - name: Backend tests
        run: PYTHONPATH=apps/qiskit-backend/src python3 -m unittest discover apps/qiskit-backend/tests
