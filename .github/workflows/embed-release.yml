name: Release embed bundle

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: embed-release-${{ github.sha }}
  cancel-in-progress: false

env:
  GH_REPO: ${{ github.repository }}
  TAG: embed-${{ github.sha }}
  RELEASE_ASSETS: 'qni-web.js qni-web_bg.wasm qni-embed.mjs qni-embed-error.mjs h.svg design-system.css h-gate.js LICENSE manifest.json manifest.json.sha256'

jobs:
  check:
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check Release App configuration
        env:
          CLIENT_ID: ${{ vars.EMBED_RELEASE_APP_CLIENT_ID }}
          HAS_KEY: ${{ secrets.EMBED_RELEASE_APP_PRIVATE_KEY != '' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$CLIENT_ID" ]]; then
            echo "::error::EMBED_RELEASE_APP_CLIENT_ID repository variable is not set" >&2
            exit 1
          fi
          if [[ "$HAS_KEY" != 'true' ]]; then
            echo "::error::EMBED_RELEASE_APP_PRIVATE_KEY secret is not set" >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check tag and release absence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node apps/web/scripts/embed-release-guard.mjs assert-absent

  build:
    needs: check
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set staging directory
        run: echo "STAGING=$RUNNER_TEMP/embed-release" >> "$GITHUB_ENV"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: '9'

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: "true"
          cache-all-crates: "true"
          workspaces: |
            apps/web

      - name: Install trunk
        uses: taiki-e/install-action@v2
        with:
          tool: trunk@0.21.14

      - name: Install Web deps
        run: pnpm install --frozen-lockfile
        working-directory: apps/web

      - name: Build release
        run: |
          node apps/web/scripts/embed-release.mjs build --output "$STAGING" --source-commit "$GITHUB_SHA"
          node apps/web/scripts/embed-release.mjs verify --output "$STAGING" --source-commit "$GITHUB_SHA"

      - name: Upload staged release files
        uses: actions/upload-artifact@v7
        with:
          name: embed-release-${{ github.sha }}
          path: ${{ env.STAGING }}
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Set staging directory
        run: echo "STAGING=$RUNNER_TEMP/embed-release" >> "$GITHUB_ENV"

      - name: Download staged release files
        uses: actions/download-artifact@v8
        with:
          name: embed-release-${{ github.sha }}
          path: ${{ env.STAGING }}

      - name: Verify staged release files
        run: node apps/web/scripts/embed-release.mjs verify --output "$STAGING" --source-commit "$GITHUB_SHA"

      - name: Prepare release notes
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { STAGING, GITHUB_REPOSITORY, GITHUB_SHA, RUNNER_TEMP } = process.env;
          const manifest = JSON.parse(fs.readFileSync(`${STAGING}/manifest.json`, 'utf8'));
          if (!Number.isSafeInteger(manifest.embed_api_version) || manifest.embed_api_version < 1) throw new Error('Invalid API version');
          const digest = fs.readFileSync(`${STAGING}/manifest.json.sha256`, 'utf8').trim().split(/\s+/)[0];
          if (!/^[a-f0-9]{64}$/.test(digest)) throw new Error('Invalid manifest digest');
          fs.writeFileSync(`${RUNNER_TEMP}/embed-release-notes.md`, `ソースコミット: https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}\n\nembed_api_version: ${manifest.embed_api_version}\n\nmanifest.json SHA-256: ${digest}\n`);
          NODE

      - name: Attest release files
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: ${{ env.STAGING }}/*

      - name: Recheck tag and release absence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node apps/web/scripts/embed-release-guard.mjs assert-absent

      - name: Create Release App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.EMBED_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.EMBED_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: qni-webgpu
          permission-contents: write

      - name: Create draft and upload all assets
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          GH_TOKEN="$GITHUB_TOKEN" node apps/web/scripts/embed-release-guard.mjs assert-absent
          gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" -f name="$TAG" \
            -F draft=true -F prerelease=false -F body=@"$RUNNER_TEMP/embed-release-notes.md" \
            > "$RUNNER_TEMP/embed-release-created.json"
          RELEASE_ID=$(node <<'NODE'
          const fs = require('node:fs');
          const { RUNNER_TEMP, TAG, GITHUB_SHA, GITHUB_ENV } = process.env;
          const release = JSON.parse(fs.readFileSync(`${RUNNER_TEMP}/embed-release-created.json`, 'utf8'));
          if (!Number.isSafeInteger(release?.id) || release.id < 1 || release.draft !== true || release.tag_name !== TAG || release.target_commitish !== GITHUB_SHA) throw new Error('Invalid created draft release');
          fs.appendFileSync(GITHUB_ENV, `RELEASE_ID=${release.id}\n`);
          process.stdout.write(String(release.id));
          NODE
          )
          GH_TOKEN="$GITHUB_TOKEN" node apps/web/scripts/embed-release-guard.mjs assert-own-draft --release-id "$RELEASE_ID"
          read -r -a names <<< "$RELEASE_ASSETS"
          for name in "${names[@]}"; do
            encoded_name=$(node -e 'process.stdout.write(encodeURIComponent(process.argv[1]))' "$name")
            content_type=$(node - "$name" <<'NODE'
          const fs = require('node:fs');
          const name = process.argv[2];
          const manifest = JSON.parse(fs.readFileSync(`${process.env.STAGING}/manifest.json`, 'utf8'));
          const contentType = name === 'manifest.json' ? 'application/json'
            : name === 'manifest.json.sha256' ? 'text/plain; charset=utf-8'
            : manifest.files.find(file => file.name === name)?.content_type;
          if (typeof contentType !== 'string' || !contentType.trim()) throw new Error(`Missing content type for ${name}`);
          process.stdout.write(contentType);
          NODE
            )
            GH_TOKEN="$GITHUB_TOKEN" node apps/web/scripts/embed-release-guard.mjs assert-own-draft --release-id "$RELEASE_ID"
            gh api --method POST "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$encoded_name" -H "Content-Type: $content_type" --input "$STAGING/$name"
          done

      - name: Verify uploaded assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Verify payload names/sizes/hashes against the local manifest before comparing remote metadata.
          node apps/web/scripts/embed-release.mjs verify --output "$STAGING" --source-commit "$GITHUB_SHA"
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > "$RUNNER_TEMP/embed-release-assets.json"
          node <<'NODE'
          const fs = require('node:fs');
          const { STAGING, RELEASE_ASSETS, RUNNER_TEMP } = process.env;
          const release = JSON.parse(fs.readFileSync(`${RUNNER_TEMP}/embed-release-assets.json`, 'utf8'));
          if (release.draft !== true || !Array.isArray(release.assets)) throw new Error('Expected draft release assets');
          const expected = RELEASE_ASSETS.split(' ').map(name => [name, fs.statSync(`${STAGING}/${name}`).size]).sort();
          const actual = release.assets.map(asset => [asset.name, asset.size]).sort();
          if (JSON.stringify(actual) !== JSON.stringify(expected)) throw new Error('Uploaded asset names/sizes differ from verified local files');
          NODE

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          GH_TOKEN="$GITHUB_TOKEN" node apps/web/scripts/embed-release-guard.mjs assert-own-draft --release-id "$RELEASE_ID"
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false -F prerelease=true
          GH_TOKEN="$GITHUB_TOKEN" node apps/web/scripts/embed-release-guard.mjs assert-published
